# On a pushed tag vX.Y.Z: build the extension zip and publish a GitHub release
# with the notes from changelog.json. Started by `git push --follow-tags`
# after `node scripts/release.mjs X.Y.Z`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that the tag matches manifest.json
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $v"
            exit 1
          fi

      - name: Build zip
        run: node scripts/release.mjs --build

      - name: Release notes
        run: node scripts/release.mjs --notes "$GITHUB_REF_NAME" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
